<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AC Bench cars</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #edf0f4; --panel: #ffffff; --ink: #172033; --muted: #556176; --rule: #d2d9e4;
  --accent: #0b6a5e; --accent-ink: #ffffff; --focus: #1858c8; --warn: #8a4b00;
  --chip-s: 60%; --chip-bg: 90%; --chip-fg: 24%;
  --font: Bahnschrift, "DIN Alternate", "Segoe UI Variable Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #11151c; --panel: #19202a; --ink: #e6ebf3; --muted: #9ba7b9; --rule: #2c3543;
    --accent: #38c4ae; --accent-ink: #05201b; --focus: #7aa9ff; --warn: #f0b259;
    --chip-s: 52%; --chip-bg: 25%; --chip-fg: 85%;
  }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.45 var(--font); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 64px; }
h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; font-stretch: 88%; }
p { margin: 0; }
.sub { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; }
#facts { color: var(--muted); margin-top: 6px; }
#facts b { color: var(--ink); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

button, input, select { font: inherit; color: inherit; }
button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; min-height: 36px; border: 1px solid var(--rule);
  border-radius: 5px; background: var(--panel); cursor: pointer; }
button:hover { border-color: var(--muted); }
input[type=search], select { padding: 7px 10px; min-height: 36px; border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); }

#tabs { display: inline-flex; margin-top: 18px; }
#tabs button { border-radius: 0; }
#tabs button:first-child { border-radius: 5px 0 0 5px; }
#tabs button:last-child { border-radius: 0 5px 5px 0; margin-left: -1px; }
#tabs button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; position: relative; }

#bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
#bar input[type=search] { flex: 1 1 240px; max-width: 360px; }
#count { margin-left: auto; color: var(--muted); }
#chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { min-height: 30px; padding: 2px 10px 2px 9px; border-radius: 15px; font-weight: 700;
  border-color: hsl(var(--h) var(--chip-s) 55% / .55); background: hsl(var(--h) var(--chip-s) var(--chip-bg)); color: hsl(var(--h) var(--chip-s) var(--chip-fg)); }
.chip .n { font-weight: 400; opacity: .85; font-size: 13px; }
.chip[aria-pressed=true] { outline: 2px solid hsl(var(--h) 70% 45%); outline-offset: 1px; }

.tablewrap { margin-top: 12px; overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { background: var(--panel); font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
th button { border: 0; background: none; padding: 0; min-height: 0; font-weight: 600; font-size: 13px; color: inherit; }
th[aria-sort=ascending] button::after { content: "\2191"; }
th[aria-sort=descending] button::after { content: "\2193"; }
th[aria-sort=ascending], th[aria-sort=descending] { color: var(--ink); }
td.num, th.num { text-align: right; }
tr.car { cursor: pointer; }
tr.car:hover td { background: color-mix(in srgb, var(--ink) 4%, transparent); }
tr.day td { background: color-mix(in srgb, var(--ink) 6%, transparent); font-weight: 600; font-size: 13px; padding: 6px 12px; }
.name { font-weight: 600; }
.flag { display: block; color: var(--warn); font-size: 12.5px; }
.cls { display: inline-block; min-width: 30px; text-align: center; padding: 1px 8px; border-radius: 12px; font-weight: 700;
  background: hsl(var(--h) var(--chip-s) var(--chip-bg)); color: hsl(var(--h) var(--chip-s) var(--chip-fg)); }
.cls.none { background: none; color: var(--muted); font-weight: 400; }
.st { white-space: nowrap; }
.st::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; border: 2px solid var(--muted); }
.st.verified::before { background: var(--accent); border-color: var(--accent); }
.st.provisional::before { border-color: var(--accent); }
tr.detail td { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 24px; font-size: 13.5px; }
.dgrid b { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; }
.hash { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
.empty { padding: 26px 18px; color: var(--muted); }
#more { margin: 12px; }
#msg { margin-top: 18px; color: var(--muted); }
#msg.err { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 640px) { h1 { font-size: 24px; } .wrap { padding: 16px 12px 56px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AC Bench cars</h1>
    <p id="facts"></p>
  </header>
  <p id="msg" role="status">Loading the cars...</p>

  <div id="tabs" hidden>
    <button type="button" id="t-new" aria-pressed="true">New cars</button>
    <button type="button" id="t-all" aria-pressed="false">All cars</button>
  </div>
  <div id="chips" hidden></div>
  <div id="bar" hidden>
    <label class="sr" for="q">Search cars</label>
    <input type="search" id="q" placeholder="Search by car name or folder">
    <label class="sr" for="status">Show</label>
    <select id="status">
      <option value="all">Every status</option>
      <option value="verified">Verified</option>
      <option value="provisional">Provisional</option>
      <option value="flagged">Flagged</option>
      <option value="unclassified">No class yet</option>
    </select>
    <button type="button" id="csv">Download CSV</button>
    <span id="count"></span>
  </div>
  <div class="tablewrap" id="tablewrap" hidden>
    <table id="tbl"><caption class="sr">Cars with class, rating and lap times</caption><thead></thead><tbody></tbody></table>
    <button type="button" id="more" hidden></button>
  </div>
</div>

<script>
"use strict";
// Same-origin by default. ?server=https://other-host reads the data from another server instead.
const BASE = (new URLSearchParams(location.search).get("server") || "").replace(/\/+$/, "");
const PAGE = 100;
const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids) if (kid !== null && kid !== undefined) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
function fmtTime(ms) {
  if (ms === null || !isFinite(ms)) return "";
  const t = Math.round(ms), m = Math.floor(t / 60000), s = Math.floor((t % 60000) / 1000);
  return m + ":" + String(s).padStart(2, "0") + "." + String(t % 1000).padStart(3, "0");
}
function fmtPct(x, signed) { return x === null || !isFinite(x) ? "" : (signed && x >= 0 ? "+" : "") + x.toFixed(2) + "%"; }
function trackParts(spec) { const i = spec.indexOf("/"); return i < 0 ? [spec, ""] : [spec.slice(0, i), spec.slice(i + 1)]; }
function classHue(i, count) { return Math.round(258 - (count > 1 ? i / (count - 1) : 0) * 238); }   // violet (fast) to orange (slow)
const date = (sec) => new Date(sec * 1000);
const fmtDate = (sec) => sec ? date(sec).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
const fmtClock = (sec) => sec ? date(sec).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
const fmtStamp = (sec) => sec ? date(sec).toLocaleString() : "";
function dayLabel(sec) {
  const d = date(sec), today = new Date(), days = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
}

/* ------------------------------------------------------------------ data */
const state = { data: null, table: null, tracks: [], labels: [], rows: [], mode: "new",
  f: { q: "", status: "all", classes: new Set() }, sort: { key: "score", dir: 1 }, shown: PAGE, open: new Set(), view: [] };

function setData(data) {
  if (!data || !Array.isArray(data.cars) || !Array.isArray(data.tracks)) throw new Error("the answer has no cars or tracks");
  const num = (x) => (typeof x === "number" && isFinite(x) ? x : null);
  state.data = data; state.tracks = data.tracks.map(String);
  state.table = data.table && typeof data.table === "object" ? data.table : null;
  state.labels = state.table && Array.isArray(state.table.labels) ? state.table.labels.map(String) : [];
  state.rows = data.cars.map((c) => {
    const times = {}, deltas = {}, n = {};
    for (const t of state.tracks) { times[t] = num((c.times_ms || {})[t]); deltas[t] = num((c.deltas || {})[t]); n[t] = num((c.n || {})[t]); }
    const updated = num(c.updated);
    return { raw: c, hash: String(c.car_hash || ""), id: String(c.car_id || ""), name: String(c.name || c.car_id || "(unnamed)"),
      status: String(c.status || ""), cls: c.class ? String(c.class) : null, score: num(c.score_pct), gap: num(c.gap_pct),
      times, deltas, n, variance: num(c.variance_pct), flags: Array.isArray(c.flags) ? c.flags.map(String) : [],
      bop: String(c.bop || ""), updated, added: num(c.added) || updated };
  });
  state.f.classes.clear(); state.shown = PAGE; state.open.clear();
}

/* ------------------------------------------------------------------ filtering and sorting */
const clsIndex = (label) => { const i = state.labels.indexOf(label); return i < 0 ? 1e9 : i; };
function sortValue(r, key) {
  switch (key) {
    case "cls": return r.cls ? clsIndex(r.cls) : null;
    case "name": return r.name.toLowerCase();
    case "status": return r.status;
    case "score": return r.score;
    case "added": return r.added;
    default: return key.startsWith("t:") ? r.times[key.slice(2)] : null;
  }
}
function computeView() {
  const f = state.f, q = f.q.trim().toLowerCase();
  const rows = state.rows.filter((r) => {
    if (q && !(r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q))) return false;
    if (f.status === "verified" || f.status === "provisional") { if (r.status !== f.status) return false; }
    if (f.status === "flagged" && !r.flags.length) return false;
    if (f.status === "unclassified" && r.cls) return false;
    if (f.classes.size && !f.classes.has(r.cls)) return false;
    return true;
  });
  const { key, dir } = state.mode === "new" ? { key: "added", dir: -1 } : state.sort;
  const have = rows.filter((r) => sortValue(r, key) !== null && sortValue(r, key) !== "");
  const none = rows.filter((r) => sortValue(r, key) === null || sortValue(r, key) === "");
  have.sort((a, b) => {
    const x = sortValue(a, key), y = sortValue(b, key);
    return (x < y ? -1 : x > y ? 1 : a.name.localeCompare(b.name)) * dir;
  });
  state.view = have.concat(none);
}

/* ------------------------------------------------------------------ rendering */
function renderFacts() {
  const f = $("facts"), rows = state.rows, week = Date.now() / 1000 - 7 * 86400;
  const parts = [[rows.length, " cars"], [rows.filter((r) => r.cls).length, " classified"], [rows.filter((r) => r.added >= week).length, " added in the last 7 days"]];
  f.replaceChildren();
  parts.forEach(([n, text], i) => f.append(i ? " · " : "", el("b", {}, n.toLocaleString()), text));
  if (state.table) f.append(" · classes v" + state.table.version);
  if (state.data.generated) f.append(" · updated " + fmtStamp(state.data.generated));
}
function renderChips() {
  const box = $("chips"); box.replaceChildren();
  box.hidden = !state.table;
  if (!state.table) return;
  const counts = {}, info = {};
  for (const r of state.rows) if (r.cls) counts[r.cls] = (counts[r.cls] || 0) + 1;
  for (const c of state.table.classes || []) info[c.label] = c;
  state.labels.forEach((lab, i) => {
    const c = info[lab], range = c ? " (" + fmtPct(c.lo) + " to " + fmtPct(c.hi) + " behind the fastest)" : "";
    const b = el("button", { type: "button", class: "chip", "aria-pressed": state.f.classes.has(lab), title: "Class " + lab + range,
      onclick: () => { if (state.f.classes.has(lab)) state.f.classes.delete(lab); else state.f.classes.add(lab); state.shown = PAGE; renderAll(); } },
      lab, " ", el("span", { class: "n" }, counts[lab] || 0));
    b.style.setProperty("--h", classHue(i, state.labels.length));
    box.append(b);
  });
  if (state.f.classes.size) box.append(el("button", { type: "button", onclick: () => { state.f.classes.clear(); state.shown = PAGE; renderAll(); } }, "Clear class filter"));
}
function columns() {
  const cols = [{ key: "cls", label: "Class" }, { key: "name", label: "Car" }, { key: "score", label: "Behind fastest", num: true }];
  for (const t of state.tracks) cols.push({ key: "t:" + t, label: t, track: t, num: true });
  cols.push({ key: "status", label: "Status" }, { key: "added", label: "Added" });
  return cols;
}
function renderTable() {
  const head = $("tbl").tHead, body = $("tbl").tBodies[0], cols = columns(), isNew = state.mode === "new";
  head.replaceChildren(); body.replaceChildren();
  const tr = el("tr");
  for (const c of cols) {
    const sorted = !isNew && state.sort.key === c.key, lab = c.track ? trackParts(c.track) : [c.label, ""];
    const inner = [lab[0], lab[1] ? el("span", { class: "sub" }, lab[1]) : null];
    tr.append(el("th", { scope: "col", class: c.num ? "num" : "", "aria-sort": isNew ? (c.key === "added" ? "descending" : null) : sorted ? (state.sort.dir > 0 ? "ascending" : "descending") : "none" },
      isNew ? el("span", {}, ...inner)
            : el("button", { type: "button", onclick: () => { state.sort = { key: c.key, dir: sorted ? -state.sort.dir : 1 }; renderAll(); } }, ...inner)));
  }
  head.append(tr);
  const total = state.view.length, show = state.view.slice(0, state.shown);
  $("count").textContent = total === state.rows.length ? total.toLocaleString() + " cars" : total.toLocaleString() + " of " + state.rows.length.toLocaleString() + " cars";
  if (!total) body.append(el("tr", {}, el("td", { colspan: cols.length, class: "empty" }, "Nothing matches. Clear the search or the filters to see more cars.")));
  const perDay = {};
  if (isNew) for (const r of state.view) if (r.added) { const k = dayLabel(r.added); perDay[k] = (perDay[k] || 0) + 1; }
  let lastDay = null;
  for (const r of show) {
    if (isNew && r.added) {
      const day = dayLabel(r.added);
      if (day !== lastDay) { lastDay = day; body.append(el("tr", { class: "day" }, el("td", { colspan: cols.length }, day + " · " + perDay[day] + (perDay[day] === 1 ? " car" : " cars")))); }
    }
    const chip = el("span", { class: "cls" + (r.cls ? "" : " none") }, r.cls || "none");
    if (r.cls) chip.style.setProperty("--h", classHue(clsIndex(r.cls), state.labels.length));
    const row = el("tr", { class: "car", tabindex: 0, "aria-expanded": state.open.has(r.hash),
        onclick: () => toggleRow(r), onkeydown: (e) => { if (e.key === "Enter") toggleRow(r); } },
      el("td", {}, chip),
      el("td", {}, el("span", { class: "name" }, r.name), el("span", { class: "sub" }, r.id), ...r.flags.map((f) => el("span", { class: "flag" }, f))),
      el("td", { class: "num" }, fmtPct(r.gap)));
    for (const t of state.tracks)
      row.append(el("td", { class: "num" }, fmtTime(r.times[t]), r.deltas[t] === null ? null : el("span", { class: "sub" }, fmtPct(r.deltas[t], true))));
    row.append(el("td", {}, el("span", { class: "st " + r.status }, r.status || "unknown")), el("td", {}, isNew ? fmtClock(r.added) : fmtDate(r.added)));
    body.append(row);
    if (state.open.has(r.hash)) body.append(detailRow(r, cols.length));
  }
  const more = $("more");
  more.hidden = total <= show.length;
  more.textContent = "Show " + Math.min(PAGE, total - show.length) + " more";
}
function detailRow(r, span) {
  const g = el("div", { class: "dgrid" });
  const item = (k, v, cls) => g.append(el("div", {}, el("b", {}, k), el("span", { class: cls || "" }, v)));
  item("Physics hash", r.hash, "hash");
  for (const t of state.tracks) {
    const parts = [fmtTime(r.times[t]) || "no time"];
    if (r.deltas[t] !== null) parts.push(fmtPct(r.deltas[t], true) + " against the reference lap");
    if (r.n[t] !== null) parts.push(r.n[t] + " matching submission" + (r.n[t] === 1 ? "" : "s"));
    item(t, parts.join(", "));
  }
  if (r.variance !== null) item("Difference between tracks", fmtPct(r.variance));
  if (r.bop) item("Balance hint", r.bop);
  if (r.added) item("First added", fmtStamp(r.added));
  if (r.updated) item("Last updated", fmtStamp(r.updated));
  return el("tr", { class: "detail" }, el("td", { colspan: span }, g));
}
function toggleRow(r) { if (state.open.has(r.hash)) state.open.delete(r.hash); else state.open.add(r.hash); renderTable(); }
function renderAll() {
  $("t-new").setAttribute("aria-pressed", state.mode === "new"); $("t-all").setAttribute("aria-pressed", state.mode === "all");
  computeView(); renderChips(); renderTable();
}

/* ------------------------------------------------------------------ csv */
function csvCell(v, text) {
  let s = v === null || v === undefined ? "" : String(v);
  if (text && /^[=+\-@\t\r]/.test(s)) s = "'" + s;      // stops a spreadsheet from running a car name as a formula
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv() {
  const head = ["class", "car", "folder", "status", "behind_fastest_pct"];
  for (const t of state.tracks) head.push("time_" + t.replace("/", "_"));
  for (const t of state.tracks) head.push("delta_pct_" + t.replace("/", "_"));
  head.push("flags", "added", "car_hash");
  const lines = [head.join(",")];
  for (const r of state.view) {
    const line = [csvCell(r.cls || "", true), csvCell(r.name, true), csvCell(r.id, true), csvCell(r.status, true), csvCell(r.gap === null ? "" : r.gap.toFixed(3))];
    for (const t of state.tracks) line.push(csvCell(fmtTime(r.times[t])));
    for (const t of state.tracks) line.push(csvCell(r.deltas[t] === null ? "" : r.deltas[t].toFixed(3)));
    line.push(csvCell(r.flags.join("; "), true), csvCell(r.added ? date(r.added).toISOString() : ""), csvCell(r.hash, true));
    lines.push(line.join(","));
  }
  const url = URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/csv" }));
  const a = el("a", { href: url, download: "ac-bench-cars-" + new Date().toISOString().slice(0, 10) + ".csv" });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ------------------------------------------------------------------ start */
function setMsg(text, err) { const m = $("msg"); m.hidden = !text; m.textContent = text || ""; m.classList.toggle("err", !!err); }
const refilter = () => { state.shown = PAGE; computeView(); renderTable(); };
$("t-new").addEventListener("click", () => { state.mode = "new"; state.shown = PAGE; renderAll(); });
$("t-all").addEventListener("click", () => { state.mode = "all"; state.shown = PAGE; renderAll(); });
$("q").addEventListener("input", (e) => { state.f.q = e.target.value; refilter(); });
$("status").addEventListener("change", (e) => { state.f.status = e.target.value; refilter(); });
$("more").addEventListener("click", () => { state.shown += PAGE; renderTable(); });
$("csv").addEventListener("click", downloadCsv);

(async function start() {
  let data;
  try {
    const res = await fetch(BASE + "/v1/classes", { cache: "no-cache" });
    if (!res.ok) throw new Error("the server answered " + res.status);
    data = await res.json();
    setData(data);
  } catch (e) {
    setMsg("Could not load the cars: " + e.message + ". Reload the page to try again.", true);
    return;
  }
  setMsg(state.table ? "" : "No class table has been published yet, so cars are listed without a class.");
  for (const id of ["tabs", "bar", "tablewrap"]) $(id).hidden = false;
  renderFacts(); renderAll();
})();
</script>
</body>
</html>
