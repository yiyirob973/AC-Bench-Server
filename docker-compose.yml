# AC Bench Cloud Server - Docker Compose Configuration
# GitHub repository: https://github.com/yiyirob973/AC-Bench-Server
#
# Quick start:
#   mkdir ac-bench && cd ac-bench
#   docker compose -f docker-compose.yml up -d --build
#
# The compose file will automatically pull the repository and build the image.
# Your reverse proxy (with your SSL certificate) forwards https://<your domain> to this container.

services:
  acbench:
    build:
      context: https://github.com/yiyirob973/AC-Bench-Server.git#dev
      dockerfile: Dockerfile
    image: acbench-server:latest
    container_name: acbench
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"              # only this host can reach it; the proxy runs here. Remove this and use
                                           # a shared docker network instead if your proxy is in another container.
    environment:
      ACB_DB: /data/acbench.db
      ACB_PUBLIC_URL: https://bench.example.com
      ACB_OIDC_ISSUER: https://id.example.com
      ACB_OIDC_CLIENT_ID: <from PocketID>
      ACB_OIDC_CLIENT_SECRET: <from PocketID>
      ACB_ADMIN_GROUPS: acb-admins   # or ACB_ADMIN_SUBS / ACB_ADMIN_EMAILS
    volumes:
      - acbench-data:/data                 # the database and backups
      - ./import:/import:ro                # files you give the server (track_check_log.json for set-env)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    # Traefik instead of publishing a port: remove "ports", join your proxy network and uncomment
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.acbench.rule=Host(`acbench.example.org`)
    #   - traefik.http.routers.acbench.entrypoints=websecure
    #   - traefik.http.routers.acbench.tls=true
    #   - traefik.http.services.acbench.loadbalancer.server.port=8080
    # networks: [proxy]

volumes:
  acbench-data:

